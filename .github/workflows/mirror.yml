name: 사진 복사
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 새 사진 받기
        run: bash .github/mirror.sh
      - name: 저장소에 올리기
        run: |
          git config user.name moketorder-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "새 사진 없음"; exit 0; fi
          n=$(git diff --cached --name-only | wc -l)
          git commit -q -m "사진 ${n}장 추가"
          git push
